name: Julia CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the [compat] lower bound; 1.12 is the release in use.
        julia: ['1.10', '1.12']

    steps:
    - uses: actions/checkout@v7

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia }}

    - name: Instantiate project
      run: julia --project=@. -e 'using Pkg; Pkg.instantiate()'

    - name: Test the static analysis preflight tool itself
      run: python3 runtime/scripts/test_julia_analyzer.py

    - name: Run static analysis preflight
      run: python3 runtime/scripts/julia_analyzer.py src/Palette.jl --verbose

    - name: Build package
      run: julia --project=@. -e 'using Pkg; Pkg.build()'

    - name: Run tests
      run: julia --project=@. -e 'using Pkg; Pkg.test()'

    - name: Run Aqua.jl quality checks
      run: |
        julia -e '
          using Pkg
          Pkg.activate(temp=true)
          Pkg.develop(path=".")
          Pkg.add("Aqua")
          using Aqua
          using Palette
          Aqua.test_all(Palette)
        '

    - name: Run JET.jl type checking (optional)
      continue-on-error: true
      run: |
        julia --project=@. -e '
          using Pkg
          Pkg.add("JET")
          using JET
          using Palette
          JET.test_package(Palette)
        '

  ijulia-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build a Julia environment with Palette + IJulia
      run: |
        julia -e '
          using Pkg
          Pkg.activate("ijulia-env")
          Pkg.develop(path=".")
          Pkg.add("IJulia")
        '

    - name: Install the kernelspec (isolated Jupyter data dir)
      run: |
        mkdir -p "$GITHUB_WORKSPACE/jupyter-data"
        JUPYTER_DATA_DIR="$GITHUB_WORKSPACE/jupyter-data" julia --project=ijulia-env -e '
          using IJulia
          IJulia.installkernel("PaletteTest", "--project=$(abspath("ijulia-env"))")
        '

    - name: Install jupyter_client
      run: pip install jupyter_client

    - name: Run the real Jupyter-wire-protocol proof (a live IJulia kernel, real ZMQ)
      run: |
        JUPYTER_DATA_DIR="$GITHUB_WORKSPACE/jupyter-data" JUPYTER_PATH="$GITHUB_WORKSPACE/jupyter-data" \
          python3 runtime/scripts/real_ijulia_proof.py

  security-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Runners are AMD or Intel at random. Package images built for one
      # runner's native CPU are rejected on the other, and that shard then
      # recompiled the whole depot, about 8 minutes. Both support x86-64-v3.
      JULIA_CPU_TARGET: x86-64-v3
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes check the Rust host only. The Python host is
        # the conformance oracle until it is removed (runtime/docs/authority.md)
        # and runs nightly and on manual dispatch.
        implementation: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["rust", "python"]' || '["rust"]') }}
        # verify_operator.py runs the shared gates on shard 1 and deals the test
        # cases across the shards by runtime/security/test-case-seconds.json.
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Configure runner Bubblewrap namespaces
      run: bash runtime/scripts/setup-ci-bubblewrap.sh

    # The sandbox clears the environment; the task environment carries the
    # CPU target to prewarm and the sessions, which compile in it.
    - name: Pass the CPU target into the sandbox
      run: |
        grep -m1 "model name" /proc/cpuinfo
        echo "JULIA_CPU_TARGET=$JULIA_CPU_TARGET" > "$RUNNER_TEMP/palette-task.env"
        echo "PALETTE_TASK_ENV=$RUNNER_TEMP/palette-task.env" >> "$GITHUB_ENV"

    # The depot holds the packages and the caches prewarm_depot.py compiles;
    # the gates still run prewarm, which only recompiles what changed.
    - name: Restore the Julia depot
      id: depot
      uses: actions/cache/restore@v4
      with:
        path: ~/.julia
        key: palette-depot-v2-${{ runner.os }}-julia1.12-${{ env.JULIA_CPU_TARGET }}-${{ hashFiles('Project.toml', 'src/**', 'runtime/security/prewarm_workload.jl') }}
        restore-keys: palette-depot-v2-${{ runner.os }}-julia1.12-${{ env.JULIA_CPU_TARGET }}-

    - name: Instantiate the operator and its test environment
      run: |
        julia --project=@. -e 'using Pkg; Pkg.instantiate()'
        julia -e '
          using Pkg
          Pkg.activate("security-test-env")
          Pkg.develop(path=".")
          Pkg.add(["JSON", "CSV", "DataFrames", "EzXML", "IJulia"])
          Pkg.instantiate()
        '

    - name: Run the canonical operator gates
      run: >-
        python3 runtime/security/verify_operator.py
        --project-dir "$GITHUB_WORKSPACE/security-test-env"
        --implementation "${{ matrix.implementation }}"
        --shard "${{ matrix.shard }}/4"

    - name: Report the depot size sessions clone
      if: always()
      run: du -sh ~/.julia ~/.palette-depot-snapshots 2>/dev/null || true

    - name: Save the Julia depot
      if: always() && matrix.shard == 1 && matrix.implementation == 'rust' && steps.depot.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.julia
        key: ${{ steps.depot.outputs.cache-primary-key }}

  operator-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@stable
    - name: Check generic toolchain boundaries and client packaging
      run: |
        python3 runtime/security/test_provisioning.py
        python3 runtime/plugins/build_bundles.py --output-dir "$RUNNER_TEMP/palette-bundles"
    - name: Configure runner Bubblewrap namespaces
      run: bash runtime/scripts/setup-ci-bubblewrap.sh
    - name: Prepare real operator dependencies and host
      run: |
        julia --project=@. -e 'using Pkg; Pkg.instantiate()'
        cargo build --manifest-path runtime/host/Cargo.toml --release --locked
    - name: Check optional Gesso installer and extension loading
      run: python3 runtime/integrations/gesso/test_gesso.py
    - name: Prepare the sandbox depot before bounded MCP interactions
      env:
        JULIA_NUM_THREADS: '1'
        JULIA_PKG_OFFLINE: 'true'
      run: >-
        python3 runtime/security/prewarm_depot.py
        --project-dir "$GITHUB_WORKSPACE"
        --host-bin "$GITHUB_WORKSPACE/runtime/host/target/release/palette-host"
    - name: Check routing, ownership, recovery and one-shot patch authority
      env:
        JULIA_NUM_THREADS: '1'
        JULIA_PKG_OFFLINE: 'true'
        PYTHONPATH: runtime/security
      run: python3 -m unittest -v test_workspace_router test_patch_broker test_server_runtime test_depot_clones test_entry_points test_preparation_messages
