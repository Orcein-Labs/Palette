name: Julia CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the [compat] lower bound; 1.12 is the release in use.
        julia: ['1.10', '1.12']

    steps:
    - uses: actions/checkout@v7

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia }}

    - name: Instantiate project
      run: julia --project=@. -e 'using Pkg; Pkg.instantiate()'

    - name: Build package
      run: julia --project=@. -e 'using Pkg; Pkg.build()'

    - name: Run tests
      run: julia --project=@. -e 'using Pkg; Pkg.test()'

    - name: Run Aqua.jl quality checks
      run: |
        julia -e '
          using Pkg
          Pkg.activate(temp=true)
          Pkg.develop(path=".")
          Pkg.add("Aqua")
          using Aqua
          using Palette
          Aqua.test_all(Palette)
        '

    - name: Run JET.jl type checking (optional)
      continue-on-error: true
      run: |
        julia --project=@. -e '
          using Pkg
          Pkg.add("JET")
          using JET
          using Palette
          JET.test_package(Palette)
        '

  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'
    - uses: dtolnay/rust-toolchain@stable
    - name: Instantiate project
      run: julia --project=@. -e 'using Pkg; Pkg.instantiate()'
    - name: Check the optional vecindex capability
      working-directory: runtime/integrations/vecindex
      run: julia --project="$GITHUB_WORKSPACE" test_vecindex.jl
    - name: Check the optional jrir capability
      working-directory: runtime/integrations/jrir
      run: |
        rustc --version || true
        clang --version | head -1 || true
        julia --project="$GITHUB_WORKSPACE" test_jrir.jl
    - name: Check the optional teamlab capability
      working-directory: runtime/integrations/teamlab
      run: |
        cargo build --manifest-path "$GITHUB_WORKSPACE/runtime/host/Cargo.toml" --release --locked
        julia --project="$GITHUB_WORKSPACE" test_teamlab.jl

  ijulia-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'

    - name: Build a Julia environment with Palette + IJulia
      run: |
        julia -e '
          using Pkg
          Pkg.activate("ijulia-env")
          Pkg.develop(path=".")
          Pkg.add(["IJulia", "ZMQ", "JSON"])
        '

    - name: Install the kernelspec (isolated Jupyter data dir)
      run: |
        mkdir -p "$GITHUB_WORKSPACE/jupyter-data"
        JUPYTER_DATA_DIR="$GITHUB_WORKSPACE/jupyter-data" julia --project=ijulia-env -e '
          using IJulia
          IJulia.installkernel("PaletteTest", "--project=$(abspath("ijulia-env"))")
        '

    - name: Run the real Jupyter-wire-protocol proof (a live IJulia kernel, real ZMQ)
      run: |
        JUPYTER_DATA_DIR="$GITHUB_WORKSPACE/jupyter-data" \
          julia --project=ijulia-env runtime/scripts/real_ijulia_proof.jl

  security-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Runners are AMD or Intel at random. Package images built for one
      # runner's native CPU are rejected on the other, and that shard then
      # recompiled the whole depot, about 8 minutes. Both support x86-64-v3.
      JULIA_CPU_TARGET: x86-64-v3
    strategy:
      fail-fast: false
      matrix:
        # cargo xtask verify runs the shared gates on shard 1 and deals the test
        # cases across the shards by runtime/security/test-case-seconds.json.
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Configure runner Bubblewrap namespaces
      run: bash runtime/scripts/setup-ci-bubblewrap.sh

    # The sandbox clears the environment; the task environment carries the
    # CPU target to prewarm and the sessions, which compile in it.
    - name: Pass the CPU target into the sandbox
      run: |
        grep -m1 "model name" /proc/cpuinfo
        echo "JULIA_CPU_TARGET=$JULIA_CPU_TARGET" > "$RUNNER_TEMP/palette-task.env"
        echo "PALETTE_TASK_ENV=$RUNNER_TEMP/palette-task.env" >> "$GITHUB_ENV"

    # The depot holds the packages and the caches `palette-host prepare` compiles;
    # the gates still run prewarm, which only recompiles what changed.
    - name: Restore the Julia depot
      id: depot
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia
        key: palette-depot-v2-${{ runner.os }}-julia1.12-${{ env.JULIA_CPU_TARGET }}-${{ hashFiles('Project.toml', 'src/**', 'runtime/security/prewarm_workload.jl') }}
        restore-keys: palette-depot-v2-${{ runner.os }}-julia1.12-${{ env.JULIA_CPU_TARGET }}-

    - name: Instantiate the operator and its test environment
      run: |
        julia --project=@. -e 'using Pkg; Pkg.instantiate()'
        julia -e '
          using Pkg
          Pkg.activate("security-test-env")
          Pkg.develop(path=".")
          Pkg.add(["JSON", "CSV", "DataFrames", "EzXML", "IJulia"])
          Pkg.instantiate()
        '

    - name: Run the canonical operator gates
      run: >-
        cargo xtask verify
        --project-dir "$GITHUB_WORKSPACE/security-test-env"
        --shard "${{ matrix.shard }}/4"

    - name: Report the depot size sessions clone
      if: always()
      run: du -sh ~/.julia ~/.palette-depot-snapshots 2>/dev/null || true

    - name: Save the Julia depot
      if: always() && matrix.shard == 1 && steps.depot.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.julia
        key: ${{ steps.depot.outputs.cache-primary-key }}

  operator-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1.12'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@stable
    - name: Check client packaging
      run: |
        sh -n runtime/scripts/install.sh
        cargo xtask bundles --output-dir "$RUNNER_TEMP/palette-bundles"
    - name: Configure runner Bubblewrap namespaces
      run: bash runtime/scripts/setup-ci-bubblewrap.sh
    - name: Prepare real operator dependencies and host
      run: |
        julia --project=@. -e 'using Pkg; Pkg.instantiate()'
        cargo build --manifest-path runtime/host/Cargo.toml --release --locked
    - name: Check the host's unit tests and its setup and service commands
      run: cargo test --manifest-path runtime/host/Cargo.toml --locked
    - name: Check optional Gesso installer and extension loading
      run: julia --project=. runtime/integrations/gesso/test_gesso.jl
    - name: Prepare the sandbox depot before bounded MCP interactions
      env:
        JULIA_NUM_THREADS: '1'
        JULIA_PKG_OFFLINE: 'true'
      run: >-
        runtime/host/target/release/palette-host prepare
        --project-dir "$GITHUB_WORKSPACE"
        --timeout-s 720
    - name: Check routing, ownership, recovery and client-confirmed patches
      env:
        JULIA_NUM_THREADS: '1'
        JULIA_PKG_OFFLINE: 'true'
        PYTHONPATH: runtime/security
      run: python3 -m unittest -v test_workspace_router
